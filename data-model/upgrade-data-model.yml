description: >-
  Entity-relationship graph of the Flex Pay API (Upgrade), derived from the
  generated OpenAPI (itself faithful to the published reference) and the
  documented resource objects. An Order is the anchor: it carries billing
  contact and add-ons, yields a single-use virtual Card for merchant payout,
  and (in the Direct Settle model) has Transactions authorized against it that
  are then captured, voided, or refunded.
entities:
