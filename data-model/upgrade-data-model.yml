    fields: [addOns, billingContact, order_items]
  - name: BillingContact
    description: Customer billing identity on the order (name, address, email, DOB).
  - name: AddOn
    id_field: externalId
    description: Ancillary item on an order (name, price).
  - name: Card
    description: >-
      Single-use virtual card issued against an approved order for merchant
      payout (number, expiration, ccv, nameOnCard, contact postal code).
  - name: Transaction
    id_field: id (uuid)
    description: >-
      Authorization against an order in the Direct Settle model, with
      original_amount, remaining_amount, captured_amount, and
      authorization_expiration; mutated by capture, void, and refund events.
  - name: Offer
    description: >-
      Marketing offer (monthly payment pricing + availability) generated for
      orders via the Marketing Offers API; unavailability is explained by
      reason codes.
relationships:
