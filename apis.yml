name: Upgrade
description: >-
  Upgrade is a San Francisco-based consumer fintech offering personal loans,
  the Upgrade Card, Rewards Checking, savings accounts, and Flex Pay — the buy
  now, pay later platform formerly known as Uplift, serving travel and retail
  merchants in the US and Canada. Upgrade is a financial technology company,
  not a bank; products are offered through bank partners. Its developer surface
  is the Flex Pay partner platform: OAuth 2.0-secured Marketing Offers,
  Checkout Orders, and Transactions REST APIs, an embeddable up.js checkout
  with the up-from-pricing web component, and iOS/Android SDKs, documented at
  docs.uplift.com.
